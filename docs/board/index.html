<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tree of Life Board</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet tool on a writer's wall
   IDEA: a marker board with a tray along its bottom edge
   PICTURE: the writing surface itself, edge to edge
   COLOUR and TYPE: white board or slate; black, blue, red, green, amber ink; Hanken Grotesk
   LAYOUT: surface fills the screen; clock pill top centre; tool tray bottom; thumb button floats */
:root{color-scheme:light;--board:#f7f6f2;--tray:#e8e5dc;--ink:#1d1d1b;--muted:#64635e;--accent:#2f6fde;--on:#2e9a4c}
:root.slate{color-scheme:dark;--board:#25302b;--tray:#18201c;--ink:#eef0ea;--muted:#a3aca6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--board);color:var(--ink);
  font:16px/1.4 "Hanken Grotesk",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.clock{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  padding:8px 18px;border-radius:999px;background:color-mix(in srgb,var(--tray) 88%,transparent);
  font-variant-numeric:tabular-nums;font-size:24px;pointer-events:none;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;background:#9a9a94}
.dot.on{background:var(--on)}
.goal{font-size:15px;color:var(--muted)}
.tray{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:center;padding:10px 12px;border-radius:18px;background:var(--tray);
  max-width:calc(100vw - 28px);box-shadow:0 6px 22px rgb(0 0 0/.16)}
.tray button{min-width:52px;height:52px;border-radius:12px;border:2px solid transparent;background:transparent;
  color:var(--ink);font:500 16px "Hanken Grotesk",system-ui,sans-serif;padding:0 12px;cursor:pointer}
.tray button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tray .sw{width:52px;padding:0}
.sw span{display:block;width:30px;height:30px;border-radius:50%;margin:auto;box-shadow:inset 0 0 0 1px rgb(0 0 0/.25)}
.sep{width:1px;height:34px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.thumb{position:fixed;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-weight:500;
  border:2px solid color-mix(in srgb,var(--ink) 30%,transparent);background:color-mix(in srgb,var(--ink) 9%,transparent);
  color:var(--muted);touch-action:none;cursor:pointer}
.thumb.on{background:var(--on);border-color:var(--on);color:#fff}
.grip{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:56px;height:28px;display:grid;place-items:center;cursor:grab}
.grip::before{content:"";width:44px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 35%,transparent)}
.sheet{position:fixed;inset:0;display:none;place-items:center;background:rgb(0 0 0/.35);padding:16px}
.sheet.open{display:grid}
.card{background:var(--board);color:var(--ink);border-radius:16px;padding:22px;width:min(600px,100%);
  box-shadow:0 20px 50px rgb(0 0 0/.3);user-select:text;-webkit-user-select:text}
.card h2{margin:0 0 6px;font-size:28px;line-height:1.1}
.card p{margin:0 0 14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card button,.card label.btn{height:48px;padding:0 16px;border-radius:10px;display:inline-grid;place-items:center;
  border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);background:var(--tray);color:var(--ink);
  font:500 16px "Hanken Grotesk",system-ui,sans-serif;cursor:pointer}
.card button.danger{color:#c23434}
.card textarea{width:100%;height:110px;font:13px ui-monospace,Menlo,monospace;margin-top:12px;border-radius:8px;padding:8px;
  background:var(--tray);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
.msg{min-height:1.4em;margin:12px 0 0!important}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
@media (prefers-reduced-motion:no-preference){.thumb,.dot{transition:background .12s}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Writing surface"></canvas>

<div class="clock" aria-live="off"><span class="dot" id="dot"></span><span id="total">0:00:00</span><span class="goal">of 5:00:00</span></div>

<div class="thumb" id="thumb" role="button" aria-label="Hold to count writing time">
  <div class="grip" id="grip" aria-label="Drag to move the button"></div>
  <span id="thumbLabel">hold</span>
</div>

<div class="tray" role="toolbar" aria-label="Tools">
  <button data-tool="marker">Marker</button>
  <button data-tool="pen">Pen</button>
  <button data-tool="eraser">Eraser</button>
  <button data-tool="hand">Move</button>
  <span class="sep"></span>
  <span id="swatches" class="row" style="gap:4px"></span>
  <span class="sep"></span>
  <button id="undo">Undo</button>
  <button id="redo">Redo</button>
  <button id="more">More</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="card">
    <h2 id="sheetTitle">Tree of Life Board</h2>
    <p>Test version. This page and its writing time are saved in this browser only. Cloud sync with the iPad comes next.</p>
    <div class="row">
      <button id="fs">Full screen</button>
      <button id="surface">Switch to slate</button>
      <button id="exp">Export page</button>
      <label class="btn" for="imp">Import page</label><input type="file" id="imp" accept=".json,application/json">
      <button id="clear" class="danger">Clear page…</button>
      <button id="close">Close</button>
    </div>
    <textarea id="out" readonly hidden aria-label="Exported page data"></textarea>
    <div class="row" id="copyRow" hidden style="margin-top:10px"><button id="copy">Copy page data</button></div>
    <p class="msg" id="msg"></p>
  </div>
</div>

<script>
{
const PAGE_W = 1600;                       // same page width as the iPad
const K_PAGE = "tol-board-page-1", K_TIME = "tol-board-intervals", K_UI = "tol-board-ui";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const r1 = n => Math.round(n * 10) / 10;

let page = store.get(K_PAGE, null);
if (!page || page.format !== "tol-page") page = { format: "tol-page", version: 1, id: "page-1", updatedAt: Date.now(), strokes: [] };
let intervals = store.get(K_TIME, []);
const ui = Object.assign({ tool: "marker", color: "#1d1d1b", slate: false, tx: null, ty: null, scrollY: 0 }, store.get(K_UI, {}));
const saveUI = () => store.set(K_UI, ui);
const COLORS = ["#1d1d1b", "#ffffff", "#2f6fde", "#d23c3c", "#2e8b57", "#e09a1a"];
const NAMES = ["Black", "White", "Blue", "Red", "Green", "Amber"];

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const buf = document.createElement("canvas"), bctx = buf.getContext("2d");
let dpr = 1, scale = 1, live = null, queued = false;

/* ---------- drawing ---------- */
function drawStroke(c, s) {
  const p = s.points; if (!p.length) return;
  const X = q => q[0] * scale * dpr, Y = q => (q[1] - ui.scrollY) * scale * dpr;
  c.strokeStyle = s.color; c.fillStyle = s.color;
  c.lineWidth = Math.max(1, s.width * scale * dpr); c.lineCap = "round"; c.lineJoin = "round";
  if (p.length === 1) { c.beginPath(); c.arc(X(p[0]), Y(p[0]), c.lineWidth / 2, 0, Math.PI * 2); c.fill(); return; }
  c.beginPath(); c.moveTo(X(p[0]), Y(p[0]));
  for (let i = 1; i < p.length - 1; i++) {
    c.quadraticCurveTo(X(p[i]), Y(p[i]), (X(p[i]) + X(p[i + 1])) / 2, (Y(p[i]) + Y(p[i + 1])) / 2);
  }
  const l = p[p.length - 1]; c.lineTo(X(l), Y(l)); c.stroke();
}
function renderBuffer() {
  buf.width = cv.width; buf.height = cv.height;
  bctx.clearRect(0, 0, buf.width, buf.height);
  for (const s of page.strokes) drawStroke(bctx, s);
}
function frame() {
  queued = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(buf, 0, 0);
  if (live) drawStroke(ctx, live);
}
const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(frame); } };
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = innerWidth / PAGE_W;
  renderBuffer(); schedule(); placeThumb();
}
const toPage = e => [e.clientX / scale, e.clientY / scale + ui.scrollY];
const widthFor = t => t === "marker" ? 8 : 2.5;

/* ---------- undo ---------- */
let undo = [], redo = [];
const pushUndo = () => { undo.push(page.strokes.slice()); if (undo.length > 100) undo.shift(); redo = []; };
function commit() {
  page.updatedAt = Date.now();
  if (!store.set(K_PAGE, page)) say("This browser couldn't save the page. Export it to keep it.");
  renderBuffer(); schedule();
}
$("undo").onclick = () => { if (undo.length) { redo.push(page.strokes.slice()); page.strokes = undo.pop(); commit(); } };
$("redo").onclick = () => { if (redo.length) { undo.push(page.strokes.slice()); page.strokes = redo.pop(); commit(); } };

/* ---------- the writing clock ---------- */
let penDown = false, thumbDown = false, since = null;
function transition(fn) {
  const was = penDown || thumbDown; fn();
  const is = penDown || thumbDown, now = Date.now();
  if (!was && is) since = now;
  else if (was && !is && since !== null) {
    intervals.push({ start: since, end: now, device: "board" }); since = null; store.set(K_TIME, intervals);
  }
  paintClock();
}
const setPen = v => { if (v !== penDown) transition(() => { penDown = v; }); };
const setThumb = v => { if (v !== thumbDown) transition(() => { thumbDown = v; }); };
function todaySeconds() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  const s0 = d.getTime(), now = Date.now();
  const list = intervals.map(i => [Math.max(i.start, s0), Math.min(i.end, now)]);
  if (since !== null) list.push([Math.max(since, s0), now]);
  const spans = list.filter(a => a[1] > a[0]).sort((a, b) => a[0] - b[0]);
  let total = 0, cs = 0, ce = 0, open = false;
  for (const [a, b] of spans) {             // overlapping moments count once
    if (!open || a > ce) { if (open) total += ce - cs; cs = a; ce = b; open = true; }
    else ce = Math.max(ce, b);
  }
  if (open) total += ce - cs;
  return total / 1000;
}
const fmt = s => { s = Math.floor(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function paintClock() {
  $("total").textContent = fmt(todaySeconds());
  $("dot").classList.toggle("on", penDown || thumbDown);
  $("thumb").classList.toggle("on", thumbDown);
  $("thumbLabel").textContent = thumbDown ? "writing" : "hold";
}
setInterval(paintClock, 500);
document.addEventListener("visibilitychange", () => { if (document.hidden) { setPen(false); setThumb(false); } });

/* ---------- writing surface: only the first touch draws (palm rule) ---------- */
let active = null, pan = null, erased = false;
function segDist2(x, y, a, b) {           // distance from the eraser to a piece of a line
  const dx = b[0] - a[0], dy = b[1] - a[1], len = dx * dx + dy * dy;
  const t = len ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / len)) : 0;
  return (a[0] + t * dx - x) ** 2 + (a[1] + t * dy - y) ** 2;
}
function hits(s, x, y, R) {
  const p = s.points, r = R + s.width / 2, r2 = r * r;
  if (p.length === 1) return (p[0][0] - x) ** 2 + (p[0][1] - y) ** 2 < r2;
  for (let i = 1; i < p.length; i++) if (segDist2(x, y, p[i - 1], p[i]) < r2) return true;
  return false;
}
function eraseAt([x, y]) {
  const n = page.strokes.length;
  const keep = page.strokes.filter(s => !hits(s, x, y, 24));
  if (keep.length !== n) { if (!erased) { pushUndo(); erased = true; } page.strokes = keep; renderBuffer(); schedule(); }
}
cv.addEventListener("pointerdown", e => {
  if (active !== null) return;
  active = e.pointerId; cv.setPointerCapture(e.pointerId);
  const pt = toPage(e);
  if (ui.tool === "hand") { pan = { y: e.clientY, s: ui.scrollY }; return; }
  if (ui.tool === "eraser") { eraseAt(pt); return; }
  live = { id: uid(), tool: ui.tool, color: ui.color, width: widthFor(ui.tool),
           points: [[r1(pt[0]), r1(pt[1]), Date.now()]], device: "board", createdAt: Date.now() };
  setPen(true); schedule();
});
cv.addEventListener("pointermove", e => {
  if (e.pointerId !== active) return;
  if (pan) { ui.scrollY = Math.max(0, pan.s - (e.clientY - pan.y) / scale); renderBuffer(); schedule(); return; }
  const co = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (co.length ? co : [e])) {
    const pt = toPage(ev);
    if (ui.tool === "eraser") eraseAt(pt);
    else if (live) live.points.push([r1(pt[0]), r1(pt[1]), Date.now()]);
  }
  schedule();
});
function endStroke(e) {
  if (e.pointerId !== active) return;
  active = null;
  if (pan) { pan = null; saveUI(); }
  if (live) { pushUndo(); page.strokes.push(live); live = null; commit(); }
  if (erased) { erased = false; commit(); }
  setPen(false);
}
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("wheel", e => { ui.scrollY = Math.max(0, ui.scrollY + e.deltaY / scale); renderBuffer(); schedule(); saveUI(); }, { passive: true });

/* ---------- thumb button ---------- */
const thumb = $("thumb"), grip = $("grip");
function placeThumb() {
  const x = ui.tx ?? 28, y = ui.ty ?? innerHeight * 0.55;
  thumb.style.left = Math.min(Math.max(0, x), innerWidth - 120) + "px";
  thumb.style.top = Math.min(Math.max(30, y), innerHeight - 120) + "px";
}
thumb.addEventListener("pointerdown", e => {
  if (e.target === grip) return;
  thumb.setPointerCapture(e.pointerId); setThumb(true);
});
const thumbUp = e => { if (e.target !== grip) setThumb(false); };
thumb.addEventListener("pointerup", thumbUp);
thumb.addEventListener("pointercancel", () => setThumb(false));
let drag = null;
grip.addEventListener("pointerdown", e => {
  e.stopPropagation(); grip.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, l: thumb.offsetLeft, t: thumb.offsetTop };
});
grip.addEventListener("pointermove", e => {
  if (!drag) return;
  ui.tx = drag.l + e.clientX - drag.x; ui.ty = drag.t + e.clientY - drag.y; placeThumb();
});
grip.addEventListener("pointerup", () => { drag = null; saveUI(); });

/* ---------- tools and colors ---------- */
const toolButtons = [...document.querySelectorAll("[data-tool]")];
$("swatches").innerHTML = COLORS.map((c, i) =>
  `<button class="sw" data-color="${c}" aria-label="${NAMES[i]}"><span style="background:${c}"></span></button>`).join("");
const swatches = [...document.querySelectorAll("[data-color]")];
function paintTools() {
  toolButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tool === ui.tool)));
  swatches.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.color === ui.color)));
  document.documentElement.classList.toggle("slate", ui.slate);
  $("surface").textContent = ui.slate ? "Switch to white board" : "Switch to slate";
}
toolButtons.forEach(b => b.onclick = () => { ui.tool = b.dataset.tool; saveUI(); paintTools(); });
swatches.forEach(b => b.onclick = () => {
  ui.color = b.dataset.color;
  if (ui.tool === "eraser" || ui.tool === "hand") ui.tool = "marker";
  saveUI(); paintTools();
});

/* ---------- More sheet ---------- */
const sheet = $("sheet");
const say = t => { $("msg").textContent = t; };
$("more").onclick = () => { say(""); sheet.classList.add("open"); };
$("close").onclick = () => sheet.classList.remove("open");
sheet.addEventListener("pointerdown", e => { if (e.target === sheet) sheet.classList.remove("open"); });
$("fs").onclick = () => {
  const el = document.documentElement;
  const p = el.requestFullscreen ? el.requestFullscreen() : null;
  if (p && p.catch) p.catch(() => say("This browser didn't allow full screen. Try F11."));
  else if (!p) say("This browser didn't allow full screen. Try F11.");
};
$("surface").onclick = () => {
  ui.slate = !ui.slate;
  if (ui.slate && ui.color === "#1d1d1b") ui.color = "#ffffff";
  if (!ui.slate && ui.color === "#ffffff") ui.color = "#1d1d1b";
  saveUI(); paintTools();
};
let clearArmed = null;
$("clear").onclick = () => {
  if (!clearArmed) {
    $("clear").textContent = "Tap again to clear";
    clearArmed = setTimeout(() => { clearArmed = null; $("clear").textContent = "Clear page…"; }, 3000);
    return;
  }
  clearTimeout(clearArmed); clearArmed = null; $("clear").textContent = "Clear page…";
  pushUndo(); page.strokes = []; commit(); say("Page cleared. Undo brings it back.");
};
function exportText() {
  return JSON.stringify({ format: "tol-board-export", version: 1, exportedAt: new Date().toISOString(),
                          pages: [page], intervals }, null, 1);
}
$("exp").onclick = () => {
  const text = exportText();
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = "TreeOfLife-board-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".json";
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { /* downloads may be blocked here */ }
  $("out").hidden = false; $("copyRow").hidden = false; $("out").value = text;
  say("Saved as a file if this browser allows downloads. The page data is also shown below to copy.");
};
$("copy").onclick = () => {
  const p = navigator.clipboard && navigator.clipboard.writeText($("out").value);
  if (p) p.then(() => say("Copied."), () => say("Copy was blocked. Select the text and copy it by hand."));
  else say("Copy was blocked. Select the text and copy it by hand.");
};
$("imp").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const p = d.format === "tol-board-export" ? d.pages && d.pages[0] : d;
    if (!p || p.format !== "tol-page" || !Array.isArray(p.strokes)) throw new Error("not a page");
    pushUndo(); page = p; commit();
    if (Array.isArray(d.intervals)) {
      const seen = new Set(intervals.map(i => i.start + ":" + i.end + ":" + i.device));
      for (const i of d.intervals) if (!seen.has(i.start + ":" + i.end + ":" + i.device)) intervals.push(i);
      store.set(K_TIME, intervals);
    }
    paintClock(); say("Page imported. Undo goes back to what was here.");
  } catch (err) { say("That file isn't a Tree of Life page. Nothing was changed."); }
};
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); (e.shiftKey ? $("redo") : $("undo")).click(); }
  if (e.key === "Escape") sheet.classList.remove("open");
});

window.addEventListener("resize", resize);
paintTools(); resize(); paintClock();
}
</script>
</body>
</html>
