<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safe mode · Book of Living Waters</title>
<!-- SAFE MODE for BOLW Core: the way back. Its own address, its own few lines of code right here in this one file.
     It uses NONE of the app's pieces: no modules, no AI, no sync, no commands. It ignores every change made to the app.
     It only READS the book kept on this device: read your leaves, export them, see rings (earlier versions) and
     what was deleted. It never writes to your book. Keep this file plain and never make it depend on the app. -->
<style>
:root{--paper:#fbfaf6;--soft:#f1efe8;--ink:#1c1d1b;--ink2:#5f5e5a;--line:rgba(0,0,0,.14);--acc:#2f6fb5}
@media (prefers-color-scheme:dark){:root{--paper:#161615;--soft:#262624;--ink:#ecebe6;--ink2:#aeada7;--line:rgba(255,255,255,.18);--acc:#7fb0e8}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:calc(14px + env(safe-area-inset-top)) 16px 60px}
main{max-width:680px;margin:0 auto}h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;color:var(--ink2);margin:22px 0 6px}p{color:var(--ink2);font-size:14px;margin:4px 0}
button,a.b{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block;margin:3px 6px 3px 0}
#leaves button,#rings button{display:block;width:100%;text-align:left;margin:0 0 6px}
small{display:block;color:var(--ink2);font-size:13px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:18px/1.6 "Iowan Old Style",Palatino,Georgia,serif;background:var(--soft);border-radius:10px;padding:12px 14px;margin:8px 0}
</style></head>
<body><main>
<h1>Safe mode</h1>
<p>This plain page can always read the book kept on this device, even if the app itself won't open. It changes nothing.</p>
<p><a class="b" href="../">Open the app</a><button id="exTxt">Export to read (.txt)</button><button id="exJson">Export everything (.json)</button></p>
<h2>Your leaves</h2><div id="leaves"></div>
<div id="read"></div>
<h2>Deleted (kept so it can be brought back in the app)</h2><div id="pruned"></div>
<h2>Rings: earlier versions kept on this device</h2><div id="rings"><p>Looking…</p></div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  var D = get("core-book");
  function pad(n) { var s = ""; while (n-- > 0) s += "    "; return s; }
  function textOf(lines, leaves, id, lead, deep, seen) { seen = seen || {}; var lf = leaves[id], out = []; if (!lf || seen[id]) return ""; seen[id] = 1;
    lf.lines.forEach(function (l) { var L = lines[l]; if (!L) return; var p = lead + pad(L.d || 0); out.push(p + (L.text || "")); if (deep && L.leaf && leaves[L.leaf]) { var t = textOf(lines, leaves, L.leaf, p + "    ", true, seen); if (t.replace(/\s/g, "")) out.push(t); } });
    return out.join("\n"); }
  function title(id) { if (!D) return ""; if (id === D.trunk) return "Trunk (the whole book)"; var lf = D.leaves[id], P = lf && D.lines[lf.parent]; return (P && P.text.replace(/^\s+|\s+$/g, "")) || "Untitled"; }
  function when(t) { return new Date(t).toLocaleString(); }
  function show(text) { $("read").innerHTML = ""; var p = document.createElement("pre"); p.textContent = text; $("read").appendChild(p); p.scrollIntoView({ block: "nearest" }); }
  function download(name, text, type) { var a = document.createElement("a"), url = URL.createObjectURL(new Blob([text], { type: type || "text/plain;charset=utf-8" })); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000); }
  var ok = D && D.leaves && D.leaves[D.trunk], live = [];
  if (ok) (function walk(id) { if (live.indexOf(id) >= 0 || !D.leaves[id]) return; live.push(id); D.leaves[id].lines.forEach(function (l) { var L = D.lines[l]; if (L && L.leaf) walk(L.leaf); }); })(D.trunk);
  if (!ok) $("leaves").innerHTML = "<p>There is no book on this device yet (or this browser's storage was cleared).</p>";
  live.forEach(function (id) { var b = document.createElement("button"); b.textContent = title(id); var s = document.createElement("small"); s.textContent = when(D.leaves[id].updatedAt); b.appendChild(s); b.onclick = function () { show(textOf(D.lines, D.leaves, id, "", id === D.trunk)); }; $("leaves").appendChild(b); });
  var pr = ok ? (D.pruned || []) : []; $("pruned").innerHTML = pr.length ? "" : "<p>Nothing.</p>";
  pr.slice().reverse().forEach(function (p) { var b = document.createElement("button"); b.textContent = p.name || "(lines)"; var s = document.createElement("small"); s.textContent = when(p.at); b.appendChild(s); b.onclick = function () { show(p.lines.map(function (r) { return pad(r.d || 0) + r.text; }).join("\n")); }; $("pruned").appendChild(b); });
  function allText() { var out = ["THE BOOK OF LIVING WATERS", "Taken out " + new Date().toLocaleString() + " (safe mode)", "", textOf(D.lines, D.leaves, D.trunk, "", true)];
    if (pr.length) { out.push("", "============================================================", "DELETED (kept)", ""); pr.forEach(function (p) { p.lines.forEach(function (r) { out.push(pad((r.d || 0) + 1) + r.text); }); out.push(""); }); }
    return out.join("\n"); }
  var day = new Date().toISOString().slice(0, 10);
  $("exTxt").onclick = function () { if (ok) download("book-of-living-waters-" + day + ".txt", allText()); };
  $("exJson").onclick = function () { if (ok) download("book-of-living-waters-" + day + ".json", JSON.stringify({ format: "bolw-core", v: 1, takenOut: new Date().toISOString(), book: D, clock: get("core-clock"), chats: get("core-chats") }, null, 1), "application/json"); };
  try { var r = indexedDB.open("core-keep", 1);
    r.onupgradeneeded = function () { r.transaction.abort(); };
    r.onerror = function () { $("rings").innerHTML = "<p>None kept yet.</p>"; };
    r.onsuccess = function () { var q = r.result.transaction("rings", "readonly").objectStore("rings").getAll();
      q.onsuccess = function () { var list = (q.result || []).sort(function (a, b) { return b.at - a.at; }); $("rings").innerHTML = list.length ? "" : "<p>None kept yet.</p>";
        list.forEach(function (v) { var b = document.createElement("button"); b.textContent = v.title || "Leaf"; var s = document.createElement("small"); s.textContent = when(v.at) + " · " + (v.why || ""); b.appendChild(s);
          b.onclick = function () { var L = {}; L[v.piece.leaf.id] = v.piece.leaf; show(textOf(v.piece.lines, L, v.piece.leaf.id, "", false)); }; $("rings").appendChild(b); }); }; };
  } catch (e) { $("rings").innerHTML = "<p>This browser won't open the database here.</p>"; }
})();
</script>
</body></html>
