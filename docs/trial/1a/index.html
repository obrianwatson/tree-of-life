<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trial 1a">
<title>Trial 1a · Writing · Book of Living Waters</title>
<!-- Trial #01 Book Phase, piece 1a: writing in one note. Separate from the book: its words are kept only on this page
     (localStorage key "bolw-trial-1a"), never in your book and never synced. -->
<style>
:root{--paper:#fbfaf6;--soft:#f1efe8;--card:#fff;--ink:#1c1d1b;--ink2:#5f5e5a;--ink3:#8b8a84;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.18);
--acc:#2f6fb5;--accbg:rgba(47,111,181,.12);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
@media (prefers-color-scheme:dark){:root{--paper:#161615;--soft:#262624;--card:#1f1f1e;--ink:#ecebe6;--ink2:#aeada7;--ink3:#7d7c77;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--acc:#7fb0e8;--accbg:rgba(127,176,232,.16)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:40vh}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:16px;height:32px;padding:0 12px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.task{position:sticky;top:0;z-index:15;background:var(--soft);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 12px 6px}
.tl{display:flex;align-items:center;gap:6px;font-size:14px;max-width:640px;margin:0 auto}
.tl b{font-weight:600}.tl .sp{flex:1;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td{font-size:14px;line-height:1.5;max-width:640px;margin:0 auto;padding:6px 2px 2px}
.td p{margin:0 0 6px}.td .nt{color:var(--ink2)}
.td .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.td .show{border-color:var(--acc);color:var(--acc);font-weight:600}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;padding:12px 18px 2px;font-size:13px;color:var(--ink3)}
.ed{outline:none;white-space:pre-wrap;word-break:break-word;padding:6px 18px 24px;font-family:var(--serif);font-size:19px;line-height:1.7;min-height:60vh;caret-color:var(--acc)}
.ed::first-line{font-size:23px;font-weight:600}
.ed:empty::before{content:"Start writing…";color:var(--ink3)}
.hide{display:none!important}
.cur{position:fixed;z-index:30;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid var(--acc);background:rgba(47,111,181,.2);pointer-events:none;transition:left 1s ease,top 1s ease,transform .2s}
.cur.down{transform:scale(.7);background:rgba(47,111,181,.45)}
.shield{position:fixed;inset:0;z-index:25}
.fade{transition:opacity .6s}.fade.out{opacity:0}
</style>
</head>
<body>
<div class="task"><div class="tl"><b id="tN"></b><span class="sp" id="tT"></span><button id="tMore">Hide</button><button id="tNext">Next</button></div><div class="td" id="tD"></div></div>
<div class="wrap fade" id="page">
<div class="top"><span>Piece 1a · writing in one note</span><span id="saved">Kept</span></div>
<div class="ed" id="ed" contenteditable="true" spellcheck="true"></div>
</div>
<div class="shield hide" id="shield"></div><div class="cur hide" id="cur"></div>
<script>
"use strict";
const $=id=>document.getElementById(id),ed=$('ed'),cu=$('cur'),KEY='bolw-trial-1a';
const START='Psalm 23\nThe Lord is my shepherd; I shall not want.\nHe maketh me to lie down in green pastures:\nhe leadeth me beside the still waters.';
/* ---------------- always kept: every change is kept at once, with where the caret was ---------------- */
let saveT;
function text(){const c=ed.cloneNode(true);c.querySelectorAll('br').forEach(b=>b.remove());return c.textContent}
function caretOff(){const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return null;const r=document.createRange();r.setStart(ed,0);r.setEnd(s.focusNode,s.focusOffset);return r.toString().length}
function keep(){clearTimeout(saveT);$('saved').textContent='Keeping…';saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({text:text(),caret:caretOff(),y:scrollY,at:Date.now()}));$('saved').textContent='Kept'}catch(e){$('saved').textContent='Not kept! Storage is blocked'}},250)}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}ed.textContent=d&&typeof d.text==='string'?d.text:START;return d}
function setCaret(off){const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n,last=null;while((n=w.nextNode())){if(off<=n.length)break;off-=n.length;last=n}
const r=document.createRange();if(n)r.setStart(n,off);else if(last)r.setStart(last,last.length);else r.setStart(ed,0);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
/* ---------------- the line you're typing stays in view, above the keyboard ---------------- */
function keepInView(){const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return;const r=s.getRangeAt(0).cloneRange();r.collapse(false);const rc=r.getClientRects()[0];if(!rc)return;
const v=window.visualViewport,bottom=(v?v.height+v.offsetTop:innerHeight)-16,topLimit=document.querySelector('.task').offsetHeight+8;
if(rc.bottom>bottom)scrollBy(0,rc.bottom-bottom+8);else if(rc.top<topLimit)scrollBy(0,rc.top-topLimit-8)}
/* Return makes a new line: a real line break in the text, the same in Safari, Firefox and Chrome */
function newLine(){const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0);r.deleteContents();const nl=document.createTextNode('\n');r.insertNode(nl);
ed.querySelectorAll('br').forEach(b=>b.remove());if(!text().slice(caretAt(nl)+1))ed.appendChild(document.createElement('br'));   // (an empty last line needs a placeholder to show)
const c=document.createRange();c.setStartAfter(nl);c.collapse(true);s.removeAllRanges();s.addRange(c);ed.normalize&&0;keep();requestAnimationFrame(keepInView)}
function caretAt(node){const r=document.createRange();r.setStart(ed,0);r.setEndBefore(node);return r.toString().length}
ed.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();newLine();done('typed')}});
ed.addEventListener('input',()=>{keep();requestAnimationFrame(keepInView);done('typed')});
document.addEventListener('selectionchange',()=>{if(document.activeElement===ed)keep()});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>requestAnimationFrame(keepInView));
ed.addEventListener('focus',()=>openTask(false));
/* ---------------- the tasks: each one shows you first, then you try it and judge it ---------------- */
const TASKS=[
{t:'Open and write',d:'Tap at the very end of the text and write a few lines of your own. Use Return for new lines.',
 n:'Notice: did the keyboard and caret come up the moment you tapped? Is the caret exactly where you tapped?',show:showEnd},
{t:'The caret',d:'Tap in the middle of a word on the first lines and add a few letters. Then tap between two words and add a word.',
 n:'Notice: does the caret land between the exact letters you aimed for? Is anything jumpy or slow?',show:showMiddle},
{t:'Always in view',d:'Keep writing new lines at the end until your writing reaches the keyboard, and keep going.',
 n:'Notice: is the line you are typing always visible above the keyboard? Does the page scroll smoothly as you go?',show:showLong},
{t:'Always kept',d:'Close this page completely (swipe it away, or close the tab), then open the link again.',
 n:'Notice: is every word still there, and are you back at the same spot on the page? (Like Apple Notes, the caret goes wherever you tap next.)',show:showKept},
{t:'Done',d:'That\'s piece 1a. Tell Claude, in your own words, anything that felt off, and in which task. When writing feels right, say "1a locked."',n:'Start over puts the page back to the start.',show:null}];
let task=0;
function paintTask(){const T=TASKS[task];$('tN').textContent=task<4?'Task '+(task+1)+' of 4':'Done';$('tT').textContent=T.t;
$('tD').innerHTML='<p>'+T.d+'</p><p class="nt">'+T.n+'</p><div class="row">'+(T.show?'<button class="show" id="tShow">Show me</button>':'')+'<button id="tBack">Back</button><button id="tReset">Start over</button></div>';
$('tNext').classList.toggle('hide',task>=4);if(T.show)$('tShow').onclick=()=>demo(T.show);
$('tBack').onclick=()=>{if(task>0){task--;paintTask()}};$('tReset').onclick=()=>{if(confirm('Put the page back to the start? What you wrote here will be cleared.')){ed.textContent=START;keep();task=0;paintTask()}}}
function openTask(v){$('tD').classList.toggle('hide',!v);$('tMore').textContent=v?'Hide':'Details'}
$('tMore').onclick=()=>openTask($('tD').classList.contains('hide'));
$('tNext').onclick=()=>{task=Math.min(4,task+1);paintTask();openTask(true)};
function done(){}
/* ---------------- Show me: a finger does it slowly, then the page is yours again ---------------- */
let run=0;const sleep=(ms,r)=>new Promise((res,rej)=>setTimeout(()=>r===run?res():rej(0),ms));
async function go(x,y,r){cu.style.left=x+'px';cu.style.top=y+'px';await sleep(1000,r)}
async function tap(r){cu.classList.add('down');await sleep(250,r);cu.classList.remove('down');await sleep(350,r)}
function rectAt(off){const w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(off<=n.length)break;off-=n.length}
const r=document.createRange();if(n)r.setStart(n,Math.min(off,n.length));else r.setStart(ed,0);r.collapse(true);return r.getClientRects()[0]||ed.getBoundingClientRect()}
async function typeAt(pos,str,r,speed){for(const ch of str){const t=text();ed.textContent=t.slice(0,pos)+ch+t.slice(pos);pos++;const rc=rectAt(pos);cu.style.transition='none';cu.style.left=rc.left+'px';cu.style.top=(rc.top+rc.height/2)+'px';
const v=window.visualViewport,b=(v?v.height:innerHeight)-30;if(rc.bottom>b)scrollBy(0,rc.bottom-b);await sleep(speed||90,r)}cu.style.transition=''}
async function tapAt(pos,r){const rc=rectAt(pos);rc.top<120||rc.bottom>innerHeight-40?ed.scrollIntoView({block:'center'}):0;const q=rectAt(pos);await go(q.left,q.top+q.height/2,r);await tap(r)}
async function showEnd(r){const t=text();await tapAt(t.length,r);await typeAt(t.length,'\nMy own line, written at the end.',r)}
async function showMiddle(r){const t=text(),p=t.indexOf('shepherd')+4;await tapAt(p,r);await typeAt(p,'-',r,300);await sleep(600,r);const t2=text(),q=t2.indexOf('green');await tapAt(q,r);await typeAt(q,'soft ',r)}
async function showLong(r){let t=text();await tapAt(t.length,r);for(let i=1;i<=8;i++){t=text();await typeAt(t.length,'\nLine '+i+' of a long passage that keeps going',r,35)}}
async function showKept(r){const p=$('page');await go(innerWidth/2,innerHeight-60,r);await tap(r);p.classList.add('out');await sleep(1300,r);p.classList.remove('out');await sleep(900,r);const t=text();await tapAt(t.length,r)}
async function demo(fn){const before=text(),r=++run;openTask(false);document.activeElement.blur();$('shield').classList.remove('hide');cu.classList.remove('hide');cu.style.left='50%';cu.style.top='70%';
try{await fn(r);await sleep(900,r)}catch(e){}
cu.classList.add('hide');$('shield').classList.add('hide');ed.textContent=before;openTask(true)}
$('shield').onclick=()=>{run++};
/* ---------------- start ---------------- */
const d=load();paintTask();openTask(true);
if(d&&d.y)requestAnimationFrame(()=>scrollTo(0,d.y));
addEventListener('scroll',()=>{clearTimeout(window.__sy);window.__sy=setTimeout(()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){v.y=scrollY;localStorage.setItem(KEY,JSON.stringify(v))}}catch(e){}},400)},{passive:true});
</script>
</body>
</html>
