<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Living Waters">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdfdfb">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Book of Living Waters</title>
<!-- Sealed frames (add-ons, a change being tried) are made from text inside the book. This line stops any frame
     from ever loading another website, so a sealed frame can't carry your words out by navigating itself. -->
<meta http-equiv="Content-Security-Policy" content="frame-src 'self'">
<style>
#bolwBoot{font:15px/1.5 system-ui,sans-serif;color:#5b6670;padding:28px;max-width:520px}
#bolwBoot button{font:inherit;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #ccd;background:#fff;margin-top:12px}
.bolw-banner{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;max-width:min(560px,calc(100% - 24px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  font:15px/1.4 system-ui,sans-serif;background:#fffdf4;color:#2b2b2b;border:1px solid #e2d6a8;border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.bolw-banner span{flex:1 1 220px}.bolw-banner button{font:inherit;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #d6cfb0;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="bolwBoot">Opening the book…<br><button id="bolwSafe" type="button">Start safely instead</button><br><small>(or hold Shift while it opens)</small></div>
<script>
/* ===================== THE BOOTLOADER — keep this tiny and stable =====================
   It starts the app from this device's CODE VAULT (IndexedDB "bolw-code") when an onboard version
   is chosen, otherwise from the published files (and saves a copy of them in the vault, so it also
   opens offline). If a version fails to start (an error while starting, or it never finished last
   time), it starts the last version that worked and says so. ?safe (or Shift / "Start safely") always
   starts the published files with no add-ons. Previews (/preview/N/) always use their own files.
   The app's own code (code.js) manages versions; this file must keep working with every version. */
(() => {
  const DB = "bolw-code", PREVIEW = /\/preview\/\d+\//.test(location.pathname);
  const safe = /[?&]safe\b/.test(location.search);
  let held = false;
  addEventListener("keydown", e => { if (e.key === "Shift") held = true; });
  addEventListener("keyup", e => { if (e.key === "Shift") held = false; });
  const goSafe = () => { const u = new URL(location.href); u.searchParams.set("safe", "1"); location.replace(u.href); };
  document.getElementById("bolwSafe").onclick = goSafe;

  /* the vault: versions {id, origin: published|onboard, label, base, files:{name:text}, note, by, at} and meta values */
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("versions", { keyPath: "id" }); r.result.createObjectStore("meta"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const req = (db, store, mode, fn) => new Promise((res, rej) => { const q = fn(db.transaction(store, mode).objectStore(store)); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  const vault = db => ({
    get: id => req(db, "versions", "readonly", s => s.get(id)),
    all: () => req(db, "versions", "readonly", s => s.getAll()),
    put: v => req(db, "versions", "readwrite", s => s.put(v)),
    meta: k => req(db, "meta", "readonly", s => s.get(k)),
    set: (k, v) => req(db, "meta", "readwrite", s => s.put(v, k))
  });
  window.__bolwVault = async () => vault(await open());

  /* the published files: app.html and every script it names */
  async function published() {
    // "x-bolw-boot" tells the offline helper (sw.js) to stay out of the way: these files come straight from the
    // network as one complete set, or not at all (then the last complete set saved on this device is used).
    const get = async n => { const r = await fetch(n, { cache: "no-cache", headers: { "x-bolw-boot": "1" } }); if (!r.ok) throw new Error(n + " " + r.status); return r.text(); };
    const app = await get("app.html"), files = { "app.html": app };
    const names = [...app.matchAll(/<script src="([^"]+)"><\/script>/g)].map(m => m[1]);
    const texts = await Promise.all(names.map(get));
    names.forEach((n, i) => { files[n] = texts[i]; });
    const ver = (app.match(/const APP_VERSION = "([^"]+)"/) || [])[1] || "?";
    return { id: "pub-" + ver, origin: "published", label: "published version " + ver, base: ver, files, note: "Published version " + ver, by: "GitHub", at: Date.now() };
  }

  /* start a file set: the page from app.html, then its scripts in order. Returns the errors. (Also used for previews.) */
  function run(files) {
    const errors = [], onErr = e => errors.push((e.message || "error") + (e.filename ? " (" + e.filename + ")" : ""));
    addEventListener("error", onErr);
    try {
      const doc = new DOMParser().parseFromString(files["app.html"], "text/html");
      const scripts = [...doc.querySelectorAll("script")].map(s => ({ src: s.getAttribute("src"), text: s.textContent }));
      doc.querySelectorAll("script").forEach(s => s.remove());
      document.title = doc.title;
      document.documentElement.lang = doc.documentElement.lang || "en";
      document.head.replaceChildren(...[...doc.head.childNodes].map(n => document.importNode(n, true)));
      const body = document.importNode(doc.body, true); document.body.replaceWith(body);
      for (const s of scripts) {
        const code = s.src ? files[s.src] : s.text;
        if (code == null) { errors.push("missing file " + s.src); continue; }
        const el = document.createElement("script");
        el.textContent = code + "\n//# sourceURL=bolw/" + (s.src || "app.html");
        document.body.appendChild(el);
      }
    } catch (e) { errors.push(e.message || String(e)); }
    removeEventListener("error", onErr);
    return errors;
  }
  window.__bolwRun = run; window.__bolwPublished = published;

  function banner(text, buttons) {
    const b = document.createElement("div"); b.className = "bolw-banner"; b.setAttribute("role", "status");
    const s = document.createElement("span"); s.textContent = text; b.appendChild(s);
    for (const [label, fn] of buttons) { const x = document.createElement("button"); x.textContent = label; x.onclick = () => { fn(); b.remove(); }; b.appendChild(x); }
    document.body.appendChild(b); return b;
  }
  window.__bolwBanner = banner;

  async function main() {
    let V = null, M = {};
    if (!PREVIEW) try { V = vault(await open()); for (const k of ["active", "pinned", "lastGood", "booting", "bad", "lastPub"]) M[k] = await V.meta(k); } catch (e) { V = null; }
    if (held && !safe) return goSafe();
    const bad = M.bad || {};
    let fell = null, v = null;
    if (V && M.booting) { bad[M.booting] = Date.now(); await V.set("bad", bad); await V.set("booting", null); }   // it never finished starting last time
    const want = safe || !V ? null : (M.pinned || M.active);
    if (want && !bad[want]) v = await V.get(want);
    else if (want) { fell = want; if (M.lastGood && !bad[M.lastGood]) v = await V.get(M.lastGood); }
    if (!v) {
      // The newest published files if the network answers within a few seconds; otherwise the last complete set saved
      // on this device (the fetch carries on, and a small note offers the update when it's ready).
      const saved = V ? ((M.lastPub && await V.get(M.lastPub)) || (await V.all()).filter(x => x.origin === "published").sort((a, b) => b.at - a.at)[0]) : null;
      const keep = async p => {
        if (!V) return p;
        const old = await V.get(p.id), same = old && JSON.stringify(old.files) === JSON.stringify(p.files);
        if (!same) await V.put(p);
        if (M.lastPub !== p.id) await V.set("lastPub", p.id);      // (so the next start can find the newest saved set without reading every version)
        return same ? old : p;
      };
      const fresh = published().then(keep);
      let late = false;
      try {
        v = await (saved ? Promise.race([fresh, new Promise(res => setTimeout(() => res(null), 3500))]) : fresh);
        if (!v) {
          v = saved; late = true;
          fresh.then(p => { if (p && p !== saved && JSON.stringify(p.files) !== JSON.stringify(saved.files)) banner("A newer version of the book is ready.", [["Reload", () => location.reload()], ["Later", () => {}]]); }).catch(() => {});
        }
      } catch (e) {                                       // offline: the newest saved published copy
        v = saved;
        if (!v) { document.getElementById("bolwBoot").textContent = "The book couldn't open: no internet, and no copy saved on this device yet. Try again when you're online."; return; }
      }
      if (!late) fresh.catch(() => {});
    }
    if (V) await V.set("booting", v.id);
    window.__bolwBoot = { id: v.id, origin: v.origin, label: v.label, base: v.base, note: v.note, at: v.at, safe, fell, files: v.files, pinned: !!M.pinned };
    const errors = run(v.files);
    const ok = !errors.length && !!window.TOL && !!document.getElementById("writer");
    window.__bolwBoot.ok = ok; window.__bolwBoot.errors = errors;
    if (ok) {
      if (V) { await V.set("booting", null); await V.set("lastGood", v.id); }
      if (fell) banner("A change didn't work, so I started the last good version. Undo it?", [
        ["Undo it", async () => { await V.set("active", v.id); if (M.pinned) await V.set("pinned", v.id); dispatchEvent(new CustomEvent("bolw:undo-bad", { detail: { bad: fell, good: v.id } })); }],
        ["Try it again", async () => { delete bad[fell]; await V.set("bad", bad); location.reload(); }],
        ["✕", () => {}]]);
      dispatchEvent(new CustomEvent("bolw:booted", { detail: window.__bolwBoot }));
    } else if (V && v.origin !== "published") {           // this version failed while starting: mark it and start the last good one
      bad[v.id] = Date.now(); await V.set("bad", bad); await V.set("booting", null); location.reload();
    } else {
      if (V) await V.set("booting", null);
      const p = document.createElement("p"); p.style.cssText = "font:15px system-ui;padding:24px";
      p.textContent = "The book couldn't start (" + errors[0] + "). Your writing is safe on this device. Try reloading, or open it with ?safe.";
      document.body.prepend(p);
    }
  }
  main().catch(e => { const b = document.getElementById("bolwBoot"); if (b) b.textContent = "The book couldn't open (" + e.message + "). Reload to try again."; });
})();
</script>
</body>
