name: Claude Code

# Write "@claude ..." in an issue or comment on this repository and
# Claude Code works on the app. Only the repository owner can trigger it,
# so nobody else can spend your Claude plan.

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          github.event.issue.author_association == 'OWNER') ||
        (github.event_name != 'issues' &&
          contains(github.event.comment.body, '@claude') &&
          github.event.comment.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A token copied from a terminal can pick up line breaks or spaces; remove them.
      - name: Tidy the Claude token
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          T=$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n\t ')
          if [ -n "$T" ]; then
            echo "::add-mask::$T"
            echo "CLEAN_CLAUDE_TOKEN=$T" >> "$GITHUB_ENV"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLEAN_CLAUDE_TOKEN }}
          # Either one works: a Claude plan token (preferred) or an Anthropic API key (billed by use).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
